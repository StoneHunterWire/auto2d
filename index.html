<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Auto Flip - Перекуп</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e94560;
            font-size: 24px;
            text-align: center;
        }
        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #16213e;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Загрузка Auto Flip...</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <!-- Yandex Games SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>

    <!-- Game Modules -->
    <script src="src/utils.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/input.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/cars.js"></script>
    <script src="src/economy.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/ads.js"></script>
    <script src="src/multiplayer.js"></script>
    <script src="src/scenes/menu.js"></script>
    <script src="src/scenes/market.js"></script>
    <script src="src/scenes/garage.js"></script>
    <script src="src/scenes/repair.js"></script>
    <script src="src/scenes/sell.js"></script>
    <script src="src/scenes/race.js"></script>
    <script src="src/scenes/coop_lobby.js"></script>
    <script src="src/game.js"></script>
</body>
</html>
